<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy Trader</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e3e3de;
    --good: #1f7a4d; --bad: #b3261e; --warn: #8a5a00; --accent: #2f5bd3; --live: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --card: #1e1e1c; --ink: #ecece8; --muted: #9b9b95; --line: #33332f;
      --good: #4cc38a; --bad: #ff6b60; --warn: #e0a83a; --accent: #7aa2ff; --live: #ff6b60; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .badge { font-weight: 700; font-size: 12px; letter-spacing: .04em; padding: 4px 10px; border-radius: 999px; border: 1.5px solid currentColor; }
  .badge.paper { color: var(--accent); } .badge.live { color: var(--live); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .k { color: var(--muted); font-size: 13px; }
  .banner { border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-weight: 550; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .banner.warn { background: color-mix(in srgb, var(--warn) 15%, var(--card)); color: var(--warn); }
  .banner.bad { background: color-mix(in srgb, var(--bad) 15%, var(--card)); color: var(--bad); }
  button { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 550; }
  td.reason { white-space: normal; min-width: 220px; }
  .pos { color: var(--good); } .neg { color: var(--bad); } .muted { color: var(--muted); }
  .tag { font-size: 12px; font-weight: 650; }
  .tag.open, .tag.add { color: var(--accent); } .tag.close { color: var(--good); } .tag.skip { color: var(--muted); } .tag.error { color: var(--bad); }
  form.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; }
  input[type=checkbox] { width: auto; }
  #msg { min-height: 1.4em; color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="row"><h1>Copy Trader</h1><span id="mode" class="badge paper">DRY RUN</span></div>
    <div class="row">
      <button id="kill" class="danger">Stop new trades</button>
      <button id="closeAll">Close all copies</button>
    </div>
  </header>

  <div id="banners"></div>

  <section class="card stats">
    <div class="stat"><div class="v" id="cash">–</div><div class="k" id="cashLabel">Paper balance</div></div>
    <div class="stat"><div class="v" id="pnl">–</div><div class="k">Realized today</div></div>
    <div class="stat"><div class="v" id="open">–</div><div class="k">Open copies</div></div>
    <div class="stat"><div class="v" id="poll">–</div><div class="k">Last feed check</div><div class="k" id="feedInfo"></div></div>
  </section>

  <section class="card">
    <h2>Open copies</h2>
    <div class="scroll"><table>
      <thead><tr><th>Coin</th><th>Side</th><th>Contracts</th><th>Entry</th><th>Margin</th><th>Leverage</th><th>Trader</th><th>Opened</th></tr></thead>
      <tbody id="positions"></tbody>
    </table></div>
  </section>

  <section class="card">
    <h2>Decisions</h2>
    <div class="scroll"><table>
      <thead><tr><th>Time</th><th>Mode</th><th>Trader</th><th>Signal</th><th>Did</th><th>Why</th><th>Contracts</th><th>Price</th><th>P&amp;L</th></tr></thead>
      <tbody id="decisions"></tbody>
    </table></div>
  </section>

  <section class="card">
    <h2>Risk limits</h2>
    <form class="settings" id="settings">
      <label>Margin per trade, max ($)<input name="max_order_usd" type="number" step="any" min="0"></label>
      <label>Margin per trade, max (% of balance)<input name="max_position_pct" type="number" step="any" min="0" max="100"></label>
      <label>Max leverage (x)<input name="max_leverage" type="number" step="any" min="1"></label>
      <label>Max open copies<input name="max_open_positions" type="number" step="1" min="0"></label>
      <label>Pause after daily loss of ($)<input name="max_daily_loss_usd" type="number" step="any" min="0"></label>
      <label>Min trader win rate (%)<input name="min_win_rate" type="number" step="any" min="0"></label>
      <label>Max price move from trader's entry (%)<input name="max_slippage_pct" type="number" step="any" min="0"></label>
      <label>Ignore signals older than (seconds)<input name="max_signal_age_sec" type="number" step="1" min="0"></label>
      <label>Allowed coins (comma separated, empty = any)<input name="allowed_symbols"></label>
      <label class="row"><input name="copy_shorts" type="checkbox"> Copy short trades</label>
    </form>
    <div class="row" style="margin-top:12px"><button class="primary" id="save">Save limits</button><span id="msg"></span></div>
  </section>

  <section class="card">
    <h2>Mode</h2>
    <p class="muted" id="liveHelp"></p>
    <div class="row"><button id="live">Turn on live trading</button><button id="paperReset">Reset paper balance</button></div>
  </section>

  <section class="card">
    <h2>Slack alerts</h2>
    <p class="muted" id="slackHelp"></p>
    <div class="row"><button id="slackTest">Send test message</button><span id="slackMsg"></span></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let state = null;
const usd = (n) => (n == null ? '–' : (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const time = (t) => (t ? new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '–');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

async function call(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'HTTP ' + r.status);
  return data;
}

function render() {
  const { status, settings: s, positions, decisions } = state;
  const live = status.mode === 'live';
  $('mode').textContent = live ? 'LIVE' : 'DRY RUN';
  $('mode').className = 'badge ' + (live ? 'live' : 'paper');
  $('cash').textContent = live ? 'on Coinbase' : usd(state.paperCash);
  $('cashLabel').textContent = live ? 'Balance' : 'Paper balance';
  $('pnl').textContent = usd(state.pnlToday);
  $('pnl').className = 'v ' + (state.pnlToday > 0 ? 'pos' : state.pnlToday < 0 ? 'neg' : '');
  $('open').textContent = positions.length;
  const feed = state.feed || { posts: 0, lastAt: null };
  $('feedInfo').textContent = feed.posts + ' new post' + (feed.posts === 1 ? '' : 's') + ' in 24h'
    + (feed.lastAt ? ', latest ' + ago(feed.lastAt) : '');
  $('poll').textContent = status.lastPoll ? (status.lastPoll.ok ? Math.round((Date.now() - status.lastPoll.at) / 1000) + 's ago' : 'failing') : 'starting';

  const banners = [];
  if (s.kill_switch) banners.push(['bad', 'Stopped: no new trades will be copied. Exits still mirror.', '']);
  if (s.paused_reason) banners.push(['warn', 'Paused (' + esc(s.paused_reason) + '). No new trades until you resume.', '<button id="resume">Resume</button>']);
  if (status.invoToken && status.lastPoll && !status.lastPoll.ok) banners.push(['bad', 'Feed check failing: ' + esc(status.lastPoll.error), '']);
  if (status.reconcileError) banners.push(['warn', 'Position check failing: ' + esc(status.reconcileError), '']);
  if (!status.invoToken) banners.push(['warn', 'Add the INVO_REFRESH_TOKEN secret to start reading signals.', '']);
  else if (status.invoTokenDaysLeft !== null && status.invoTokenDaysLeft < 30) banners.push(['warn', 'Invo token expires in ' + status.invoTokenDaysLeft + ' days.', '']);
  $('banners').innerHTML = banners.map(([k, t, b]) => `<div class="banner ${k}"><span>${t}</span>${b}</div>`).join('');
  if ($('resume')) $('resume').onclick = () => act('/api/resume', {});

  $('kill').textContent = s.kill_switch ? 'Allow new trades' : 'Stop new trades';
  $('kill').className = s.kill_switch ? 'primary' : 'danger';

  $('positions').innerHTML = positions.length ? positions.map((p) => `<tr>
    <td>${esc(p.ticker)} <span class="muted">${esc(p.product_id)}</span></td><td>${p.side}</td><td>${p.contracts}</td>
    <td>${usd(p.entry_price)}</td><td>${usd(p.margin_usd)}</td><td>${p.leverage}x</td><td>${esc(p.trader_name)}</td><td>${time(p.opened_at)}</td></tr>`).join('')
    : '<tr><td colspan="8" class="muted">No open copies.</td></tr>';

  $('decisions').innerHTML = decisions.length ? decisions.map((d) => `<tr>
    <td>${time(d.ts)}</td><td class="muted">${d.mode === 'live' ? 'live' : 'paper'}</td><td>${esc(d.trader_name)}</td>
    <td>${esc(d.signal_action)} ${esc(d.signal_side ?? '')} ${esc(d.ticker)}${d.signal_leverage ? ' ' + d.signal_leverage + 'x' : ''}</td>
    <td><span class="tag ${d.decision}">${d.decision}</span></td><td class="reason">${esc(d.reason)}</td>
    <td>${d.contracts ?? ''}</td><td>${d.price ? usd(d.price) : ''}</td>
    <td class="${d.pnl_usd > 0 ? 'pos' : d.pnl_usd < 0 ? 'neg' : ''}">${d.pnl_usd != null ? usd(d.pnl_usd) : ''}</td></tr>`).join('')
    : '<tr><td colspan="9" class="muted">No trade signals yet. ' + ((state.feed && state.feed.posts)
      ? 'Your Invo feed had ' + state.feed.posts + ' new posts in the last 24 hours, but none were verified trades.'
      : 'Nobody you follow on Invo has posted in the last 24 hours. Follow more active traders on Invo to get signals.') + '</td></tr>';

  const f = $('settings');
  if (!f.contains(document.activeElement)) {
    for (const el of f.elements) {
      if (el.type === 'checkbox') el.checked = !!s[el.name];
      else if (el.name === 'allowed_symbols') el.value = (s.allowed_symbols || []).join(', ');
      else el.value = s[el.name];
    }
  }

  $('live').textContent = s.live_enabled ? 'Switch back to dry run' : 'Turn on live trading';
  $('live').className = s.live_enabled ? 'primary' : 'danger';
  $('live').disabled = !status.liveLockOpen && !s.live_enabled;
  $('paperReset').disabled = live;
  $('liveHelp').textContent = !status.liveLockOpen
    ? 'Live trading is locked. To unlock it, set LIVE_TRADING to "true" in wrangler.jsonc and redeploy. Until then every trade is simulated with real Coinbase prices.'
    : !status.coinbaseKeys ? 'Live is unlocked, but the Coinbase API key secrets are missing.'
    : live ? 'Live: copies place real Coinbase futures orders.' : 'Unlocked. Turning live on places real Coinbase futures orders.';
  $('slackTest').disabled = !status.slack;
  $('slackHelp').textContent = status.slack
    ? 'On. Slack gets a message for every copy, close and error, when the feed fails or recovers, and when copying pauses.'
    : 'Off. Add a Slack incoming webhook as the SLACK_WEBHOOK_URL secret to turn alerts on.';
}

function ago(t) {
  const s = Math.round((Date.now() - t) / 1000);
  return s < 120 ? s + 's ago' : s < 7200 ? Math.round(s / 60) + 'm ago' : s < 172800 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago';
}

async function refresh() {
  try { state = await call('/api/state'); render(); $('msg').textContent = ''; }
  catch (e) { $('msg').textContent = e.message; }
}

async function act(path, body, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  try { await call(path, body); await refresh(); } catch (e) { alert(e.message); }
}

$('kill').onclick = () => act('/api/kill', { on: !state.settings.kill_switch });
$('closeAll').onclick = () => act('/api/close-all', {}, 'Close every open copy at market price now?');
$('live').onclick = () => state.settings.live_enabled
  ? act('/api/live', { on: false })
  : act('/api/live', { on: true }, 'Turn on LIVE trading? New copies will place real Coinbase futures orders with real money.');
$('slackTest').onclick = async () => {
  try { const r = await call('/api/slack-test', {}); $('slackMsg').textContent = r.ok ? 'Sent. Check Slack.' : 'Slack rejected it. Check the webhook URL.'; }
  catch (e) { $('slackMsg').textContent = e.message; }
};
$('paperReset').onclick = () => act('/api/paper-reset', {}, 'Reset the paper balance?');
$('save').onclick = async () => {
  const body = {};
  for (const el of $('settings').elements) body[el.name] = el.type === 'checkbox' ? el.checked : el.value;
  try { await call('/api/settings', body); $('msg').textContent = ''; await refresh(); } catch (e) { $('msg').textContent = e.message; }
};

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
